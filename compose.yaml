services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aoi_catalog
      MYSQL_USER: aoi
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run setup_mysql.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup_mysql.py first}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u aoi -D aoi_catalog -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_USER: aoi
      DB_NAME: aoi_catalog
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
volumes:
  mysql_data:
